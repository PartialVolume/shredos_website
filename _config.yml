# --- Site Identity & SEO ---
title: ShredOS
description: Official open-source bootable disk wipe software and Linux data erasure distribution powered by nwipe.
author: PartialVolume
# Use these when ready to go live with shredos.com
url: "https://shredos.com"
baseurl: ""

# temporarily use this for testing before going live so theme shows correctly
#url: "https://partialvolume.github.io"
#baseurl: "/shredos_website"

# --- Theme (Remote keeps the repo clean for PRs) ---
remote_theme: daattali/beautiful-jekyll@6.0.1
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag

# --- Navigation Bar ---
navbar-links:
  Home: "/"
  Quick Start: "quickstart"
  User Guide:
    - Drive Selection: "drive-selection"
  FAQ & Hardware: "faq"
  Official GitHub: "https://github.com/PartialVolume/shredos.x86_64"
  Releases (Download): "https://github.com/PartialVolume/shredos.x86_64/releases"

# --- Branding & Colors ---
# Uncomment once you place logo and screenshot PNGs in assets/img/
title-img: "/assets/img/shredos-logo.png"
favicon: "/favicon.ico"
round-avatar: false
navbar-col: "#e9ecef"
navbar-text-col: "#1b1f23"
navbar-border-col: "#2ea44f"
page-col: "#ffffff"
text-col: "#24292e"
link-col: "#0366d6"
hover-col: "#005cc5"
footer-col: "#f6f8fa"
footer-text-col: "#586069"

# --- Community Contributions ---
edit_page_button: true
github_username: PartialVolume

# --- Footer Social Links ---
social-network-links:
  github: PartialVolume/shredos.x86_64

# --- Search Engine & Security ---
keywords: "ShredOS, nwipe, DBAN alternative, secure disk wipe, bootable USB eraser, NVMe sanitize, ATA secure erase, data sanitization"
